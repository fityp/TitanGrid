name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Check package version matches release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/grid/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag v$tag does not match titangrid version $pkg in packages/grid/package.json"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build -w titangrid
      - run: npm --version
      - run: npm publish -w titangrid --provenance --access public
